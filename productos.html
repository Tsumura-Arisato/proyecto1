<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Hoja de estilos propia -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Core Medal Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="tags.html">Tags</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="formulario.html">Formulario</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header>
        <h1>Inventario de Medallas</h1>
        <p id="intro-text">Administra los productos a través de la REST-API.</p>
    </header>

    <div class="content-section">
        <h2>Producto</h2>
        <form id="form-producto">
            <input type="hidden" id="producto-id">
            <div class="mb-3">
                <label for="producto-nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="producto-nombre" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="producto-descripcion" class="form-label">Descripción:</label>
                <input type="text" class="form-control" id="producto-descripcion" maxlength="255">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="producto-cantidad" class="form-label">Cantidad:</label>
                    <input type="number" class="form-control" id="producto-cantidad" min="0" value="0">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="producto-precio" class="form-label">Precio:</label>
                    <input type="number" class="form-control" id="producto-precio" min="0" step="0.01" required>
                </div>
            </div>
            <button type="submit" id="btn-guardar-producto" class="btn btn-success">Agregar producto</button>
            <button type="button" id="btn-cancelar-edicion" class="btn btn-secondary" style="display:none;">Cancelar</button>
            <p id="producto-mensaje" class="mt-3" style="display:none;"></p>
        </form>
    </div>

    <div class="content-section">
        <h2>Lista de productos</h2>
        <div class="table-responsive">
            <table class="table table-bordered">
                <thead>
                    <tr><th>Nombre</th><th>Descripción</th><th>Cantidad</th><th>Precio</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>
    </div>

    <footer>
        &copy; 2026 Proyecto Ricefields
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
